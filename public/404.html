<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KICKSBASE</title>
    <script>
      (() => {
        const redirectKey = "__kicksbase_static_redirect"
        const isProjectPages = window.location.hostname.endsWith(".github.io")
        const pathSegments = window.location.pathname.split("/").filter(Boolean)
        const basePath = isProjectPages && pathSegments.length > 1
          ? `/${pathSegments[0]}/`
          : "/"
        const logicalPath = basePath === "/"
          ? window.location.pathname
          : `/${pathSegments.slice(1).join("/")}`
        const requestedPath = logicalPath + window.location.search + window.location.hash

        try {
          window.sessionStorage.setItem(redirectKey, requestedPath)
        } catch {
          // The catalog root still loads when session storage is unavailable.
        }

        window.location.replace(basePath)
      })()
    </script>
  </head>
  <body></body>
</html>
