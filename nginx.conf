pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 30;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 128k;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self' https://api.kicksbase.ru; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location ~* ^/assets/.*\.(?:css|js|woff2?|png|jpe?g|gif|webp)$ {
            expires 1y;
            try_files $uri =404;
        }

        location ~* ^/catalog/.*\.(?:png|jpe?g|webp)$ {
            expires 7d;
            try_files $uri =404;
        }

        # /catalog is an SPA route, while /catalog/ also exists on disk for
        # product media. Serve the app explicitly so nginx never redirects a
        # customer to the container's internal :8080 port.
        location = /catalog {
            try_files /index.html =404;
            expires -1;
        }

        location = /catalog/ {
            try_files /index.html =404;
            expires -1;
        }

        location / {
            try_files $uri /index.html;
            expires -1;
        }
    }
}
